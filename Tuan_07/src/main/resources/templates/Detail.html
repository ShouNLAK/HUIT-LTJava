<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container bg-white p-4 rounded shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover table-striped align-middle border">
            <thead class="table-primary text-center">
            <tr>
                <th scope="col" style="width: 10%;">Mã SP</th>
                <th scope="col" style="width: 20%;">Tên Sản Phẩm</th>
                <th scope="col" style="width: 15%;">Đơn Giá</th>
                <th scope="col" style="width: 10%;">Số Lượng</th>
                <th scope="col" style="width: 30%;">Mô Tả</th>
                <th scope="col" style="width: 15%;">Danh Mục</th>
            </tr>
            </thead>
            <tbody>
            <td class="text-center fw-bold text-secondary" th:text="${SP.maSP}"></td>
            <td class="fw-semibold" th:text="${SP.tenSP}"></td>
            <td class="text-end text-danger fw-semibold"
                th:text="${#numbers.formatDecimal(SP.donGia, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
            <td class="text-center" th:text="${SP.soLuong}"></td>
            <td class="text-muted text-wrap" th:text="${SP.moTa}"></td>
            <td class="text-center">
                <span class="badge bg-info text-dark" th:text="${SP.maDM.tenDM}"></span>
            </td>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
