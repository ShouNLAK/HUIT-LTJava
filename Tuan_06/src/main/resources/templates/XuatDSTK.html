<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Danh sách Tài khoản</h4>
            <a th:href="@{/Them}" class="btn btn-light btn-sm">Thêm Tài khoản</a>
        </div>
        <div class="card-body">
            <form th:action="@{/}" method="get" class="mb-3 d-flex">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Nhập tên, ID, Email ..."/>
                <button type="submit" class="btn btn-secondary">Tìm kiếm</button>
            </form>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Họ</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="TK : ${DSTK}">
                    <td th:text="${TK.ID}"></td>
                    <td th:text="${TK.firstName}"></td>
                    <td th:text="${TK.lastName}"></td>
                    <td th:text="${TK.email}"></td>
                    <td>
                        <a th:href="@{/Cap-Nhat(taiKhoanID=${TK.ID})}" class="btn btn-warning btn-sm">Sửa</a>
                        <a th:href="@{/Xoa(taiKhoanID=${TK.ID})}" class="btn btn-danger btn-sm"
                           onclick="if (!(confirm('Bạn có chắc chắn muốn xóa tài khoản này?'))) return false">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
