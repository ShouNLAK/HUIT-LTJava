<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <form class="col-md-4 col-md-offset-4" th:action="@{/Dashboard}" method="POST">
        <h1 class="text-primary">Sign In</h1>
        <div class="form-group">
            <p>Email Address</p>
            <input type="Email" placeholder="Email Address" name="email" required class="form-control"/>
        </div>
        <div class="form-group">
            <p>Password</p>
            <input type="password" placeholder="Password" name="password" required class="form-control"/>
        </div>
        <div class="form-group">
            <input type="checkbox" name="remember-me" id="remember-me"/> <span>Remember me</span>
        </div>
        <button class="btn-primary" type="submit">Sign In</button>
    </form>

</body>
</html>
